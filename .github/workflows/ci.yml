name: CI

# Fast checks on every push / PR. The full image build (20+ min, downloads
# 80+ tools) only runs when the Dockerfile or tool lists change, or by hand.
# Nothing runs on a schedule, so there are no surprise failure emails.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_image:
        description: "Also build the Docker image"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ShellCheck + hadolint + compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck -x -S warning setup.sh install.sh scripts/*/*.sh docker/*.sh tests/*.sh

      - name: Bash syntax
        run: for f in setup.sh install.sh scripts/*/*.sh docker/entrypoint.sh tests/*.sh; do bash -n "$f"; done

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: docker compose config
        run: docker compose config -q

  smoke:
    name: Pipeline smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/smoke.sh

  changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "image=${{ inputs.build_image }}" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD~1 HEAD 2>/dev/null \
               | grep -qE '^(Dockerfile|config/|requirements.txt|scripts/lib/bootstrap.sh|docker/)'; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: Docker image build
    needs: [lint, smoke, changes]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build
        run: docker build -t hackkit:ci .
      - name: Container smoke test
        run: |
          docker run --rm hackkit:ci recon -h
          docker run --rm hackkit:ci bash -lc 'for t in subfinder httpx nuclei dnsx ffuf dalfox feroxbuster massdns arjun uro; do command -v "$t" >/dev/null && echo "ok  $t" || { echo "MISSING $t"; exit 1; }; done'
