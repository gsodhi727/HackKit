# ============================================================
#  HackKit — Docker Compose
#  Usage:
#    docker compose run --rm hackkit                              # interactive shell
#    docker compose run --rm hackkit recon -d target.com          # recon pipeline
#    docker compose run --rm hackkit xss -d target.com            # XSS pipeline
#    docker compose run --rm hackkit fuzz -u https://target.com   # fuzzer
#    docker compose run --rm hackkit scripts/recon/recon.sh -d target.com
#  Results land in ./workspace on the host.
# ============================================================

services:
  hackkit:
    image: hackkit:latest
    build:
      context: .
      dockerfile: Dockerfile
    hostname: hackkit

    # ── Interactive terminal ───────────────────────────────────
    stdin_open: true
    tty: true

    # ── Shared volumes ────────────────────────────────────────
    # Only data is persisted. Go binaries and Python tools are NOT put in
    # volumes any more: a named volume keeps its first contents forever,
    # so after rebuilding the image you'd still get the old tools.
    volumes:
      # Your target workspace (results are written here)
      - ./workspace:/root/workspace
      # Large wordlists — survive container restarts
      - hackkit-wordlists:/root/wordlists
      # Nuclei templates — updated in place by `update`
      - hackkit-nuclei:/root/nuclei-templates

    # ── Network ──────────────────────────────────────────────
    # Host mode lets scanners (naabu, nmap, masscan) see the host's network
    # directly. It also removes Docker's network isolation for this container,
    # so only run trusted tools / targets you're authorised to test.
    network_mode: host

    # ── Capabilities needed for raw sockets (nmap, masscan) ──
    cap_add:
      - NET_ADMIN
      - NET_RAW

    # ── Environment ───────────────────────────────────────────
    # API keys (e.g. PDCP_API_KEY for chaos, SHODAN_API_KEY) go in a
    # git-ignored .env file next to this one — never in the repo.
    env_file:
      - path: .env
        required: false
    environment:
      - TERM=xterm-256color
      - LANG=C.UTF-8

volumes:
  hackkit-wordlists:
  hackkit-nuclei:
